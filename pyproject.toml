[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finale-file-parser"
version = "0.3.0"
description = "A parser for Finale music notation files (.mus/.musx)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jsawruk" }]
keywords = ["finale", "music", "notation", "musicxml", "enigma", "musx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["defusedxml>=0.7.1"]

[project.urls]
Homepage = "https://github.com/jsawruk/finale-file-parser"
Repository = "https://github.com/jsawruk/finale-file-parser"
Issues = "https://github.com/jsawruk/finale-file-parser/issues"

[project.scripts]
# The command is shorter than the distribution, which is ordinary --
# python-dateutil gives you `dateutil`. See src/finale_file_parser/cli.py.
finale-parser = "finale_file_parser.cli:main"

[dependency-groups]
# Dev tooling. `uv sync` installs these by default.
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-defusedxml>=0.7",
    # Engraves the pitch examples in docs/formats/finale-formats.pdf. A
    # build-time tool like the browser that prints the PDF -- not a dependency
    # of the parser, and nothing it produces is linked into the library. The
    # document still builds without it; the examples are simply omitted.
    "verovio>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ships the PEP 561 marker, without which an installing project's mypy ignores
# this package's annotations entirely -- the whole codebase is `mypy --strict`.
finale_file_parser = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Start sensible; tighten as the project matures.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
