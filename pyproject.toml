[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finale-file-parser"
version = "0.0.1"
description = "A parser for Finale music notation files (.mus/.musx)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1"]

[project.scripts]
# The command is shorter than the distribution, which is ordinary --
# python-dateutil gives you `dateutil`. See src/finale_file_parser/cli.py.
finale-parser = "finale_file_parser.cli:main"

[dependency-groups]
# Dev tooling. `uv sync` installs these by default.
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-defusedxml>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Start sensible; tighten as the project matures.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
